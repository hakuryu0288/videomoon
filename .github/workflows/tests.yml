name: Tests

on:
  push:
    branches: [main]
    paths: ["prototype/**", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          pip install -q playwright
          python -m playwright install --with-deps chromium webkit
      - name: 合成の部品（Node）
        run: node tests/mux_node.js
      - name: アプリ全体（Chromium）
        run: python tests/e2e.py
      - name: アプリ全体（WebKit）
        run: BROWSER=webkit python tests/e2e.py
