name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ["prototype/**", "README.md", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Build debug APK
        run: |
          for i in 1 2 3; do
            gradle :app:assembleDebug --stacktrace && exit 0
            echo "ビルド失敗（${i}回目）。依存ライブラリの取得失敗に備えて30秒後に再試行します"
            sleep 30
          done
          exit 1
      - uses: actions/upload-artifact@v4
        with:
          name: videomoon-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk videomoon-debug.apk
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: videomoon 最新ビルド
          body: |
            main ブランチの最新コードから自動で作られたAPKです。
            Android端末のブラウザで videomoon-debug.apk をダウンロードし、開いてインストールしてください。
            （初回は「提供元不明のアプリ」のインストール許可が必要です）
          prerelease: true
          make_latest: true
          files: videomoon-debug.apk
